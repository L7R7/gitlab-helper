# Inspired by https://github.com/kowainik/stan/blob/30ae41dccde49feefe19913039014f3612e5d44c/.github/workflows/release.yml
name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"

jobs:
  create_release:
    name: Create Github Release
    runs-on: ubuntu-latest
    steps:
      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
        run: |
          gh release create "$tag" \
            --repo="$GITHUB_REPOSITORY" \
            --title="$tag" \
            --generate-notes \
            --draft

  build_artifact:
    needs: [create_release]
    name: ${{ matrix.os }}/${{ matrix.arch }}/${{ github.ref }}
    runs-on: ${{ matrix.os }}
    env:
      GHC_VERSION: 9.10.3
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: macOS-latest
            arch: aarch64
          - os: macos-15-intel
            arch: x86_64
          - os: windows-latest
            arch: x86_64

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set tag name
        uses: olegtarasov/get-tag@v2.1.4
        id: tag
        with:
          tagRegex: "v(.*)"
          tagRegexGroup: 1

      - name: Setup Haskell
        uses: haskell-actions/setup@v2.12.0
        with:
          ghc-version: ${{ env.GHC_VERSION }}
          enable-stack: true
          stack-version: 3.9.3

      - name: Cache ~/.stack
        uses: actions/cache@v6
        with:
          path: ~/.stack
          key: ${{ runner.os }}-${{ env.GHC_VERSION }}-${{ matrix.arch }}-${{ hashFiles('**/stack.yaml.lock','**/gitlab-helper.cabal') }}-v2
          restore-keys: |
            ${{ runner.os }}-${{ env.GHC_VERSION }}-${{ matrix.arch }}-
            ${{ runner.os }}-${{ env.GHC_VERSION }}-
            ${{ runner.os }}-

      - name: Build binary
        run: |
          mkdir bin
          stack build --copy-bins --local-bin-path bin

      - if: matrix.os == 'windows-latest'
        name: Set binary path name on Windows
        run: |
          echo "BINARY_PATH=./bin/gitlab-helper.exe" >> $env:GITHUB_ENV

      - if: matrix.os != 'windows-latest'
        name: Set binary path name not on Windows
        run: |
          echo "BINARY_PATH=./bin/gitlab-helper" >> "$GITHUB_ENV"

      - if: runner.os != 'macOS'
        name: Compress binary
        uses: svenstaro/upx-action@3.0.0
        with:
          files: ${{ env.BINARY_PATH }}

      - if: matrix.os == 'windows-latest'
        name: Set zip file path name on Windows
        run: |
          echo "ZIP_PATH=./bin/gitlab-helper-${{ steps.tag.outputs.tag }}-${{ runner.os }}-${{ matrix.arch }}.zip" >> $env:GITHUB_ENV

      - if: matrix.os != 'windows-latest'
        name: Set zip file path name not on Windows
        run: |
          echo "ZIP_PATH=./bin/gitlab-helper-${{ steps.tag.outputs.tag }}-${{ runner.os }}-${{ matrix.arch }}.zip" >> "$GITHUB_ENV"

      - name: Create zip file
        run: |
          7z a "${{ env.ZIP_PATH }}" "${{ env.BINARY_PATH }}"

      - name: Upload Release Asset
        id: upload-release-asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" "${{ env.ZIP_PATH }}#gitlab-helper-${{ steps.tag.outputs.tag }}-${{ runner.os }}-${{ matrix.arch }}.zip" --repo="$GITHUB_REPOSITORY"

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: macOS-latest
            arch: aarch64
          - os: macos-15-intel
            arch: x86_64
          - os: windows-latest
            arch: x86_64
    name: Test built binaries
    runs-on: ${{ matrix.os }}
    needs: build_artifact
    steps:
      - # Apparently, gh requires to live in a git repo in order to work on windows
        if: matrix.os == 'windows-latest'
        name: Check out code
        uses: actions/checkout@v7

      - name: Set tag name
        uses: olegtarasov/get-tag@v2.1.4
        id: tag
        with:
          tagRegex: "v(.*)"
          tagRegexGroup: 1

      - name: download and extract executable
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ github.ref_name }}" --pattern '*${{ runner.os }}-${{ matrix.arch }}.zip' --repo="$GITHUB_REPOSITORY" --output artifact.zip
          7z e artifact.zip

      - if: runner.os != 'Linux'
        name: smoke test
        run: |
          ./gitlab-helper --version

      - if: runner.os == 'macOS'
        name: Check macOS dylib dependencies are system-only
        run: |
          otool -L ./gitlab-helper | tail -n +2 | awk '{print $1}' | \
            grep -vE '^(/usr/lib/|/System/)' && { echo "non-system dylib"; exit 1; } || true

      - if: runner.os == 'Linux'
        name: Standalone test (Linux, minimal container)
        run: |
          docker run --rm -v "$PWD:/work" -w /work ubuntu:24.04 \
            ./gitlab-helper --version
